name: Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "packages/shared/**"
      - "supabase/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://nxptedmacsdqnehcatpi.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ADIJVNUYTFPR7TaNxJ5tGA_b_YE1h-7
      EXPO_PUBLIC_VOICE_TOKEN_URL: https://nxptedmacsdqnehcatpi.supabase.co/functions/v1/livekit-token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: jehoo-chat-mobile-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
